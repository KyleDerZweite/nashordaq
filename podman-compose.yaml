# Shared manifest for Docker Compose and podman-compose.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Containerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NASHORDAQ_DATABASE_URL: sqlite+aiosqlite:////app/data/nashordaq.db
    volumes:
      - ./data:/app/data:z
      - ./demo:/demo:ro,z
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
    restart: unless-stopped
    ports:
      - "${NASHORDAQ_HTTP_BIND:-0.0.0.0}:${NASHORDAQ_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
