version: "3"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Containerfile
    container_name: nashordaq-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NASHORDAQ_DATABASE_URL=sqlite+aiosqlite:///data/nashordaq.db
      - NASHORDAQ_CORS_ORIGINS=http://localhost,https://${NASHORDAQ_DOMAIN:-localhost}
    volumes:
      - ./data:/app/data:z
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
    container_name: nashordaq-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy

  newt:
    image: docker.io/fosrl/newt:latest
    container_name: nashordaq-newt
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PANGOLIN_ENDPOINT=${PANGOLIN_ENDPOINT}
      - NEWT_ID=${NEWT_ID}
      - NEWT_SECRET=${NEWT_SECRET}
    depends_on:
      - frontend

