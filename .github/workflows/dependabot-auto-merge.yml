name: Dependabot Auto-Merge

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-dependabot-pr:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Select eligible PR
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: |
          pr_number="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$EVENT_PATH")"
          actor_login="$(jq -r '.workflow_run.actor.login // empty' "$EVENT_PATH")"

          if [ -z "$pr_number" ]; then
            echo "No pull request is associated with this CI run."
            exit 0
          fi

          if [ "$actor_login" != "dependabot[bot]" ]; then
            echo "PR #$pr_number was not opened by Dependabot."
            exit 0
          fi

          echo "PR_NUMBER=$pr_number" >> "$GITHUB_ENV"
          echo "PR_URL=https://github.com/${GITHUB_REPOSITORY}/pull/$pr_number" >> "$GITHUB_ENV"

      - name: Wait for mergeability to be calculated
        if: env.PR_NUMBER != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ env.PR_URL }}
        run: |
          for attempt in 1 2 3 4 5; do
            state="$(gh pr view "$PR_URL" --json mergeStateStatus --jq .mergeStateStatus)"
            if [ "$state" != "UNKNOWN" ]; then
              echo "mergeStateStatus=$state"
              echo "MERGE_STATE=$state" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 3
          done

          echo "MERGE_STATE=UNKNOWN" >> "$GITHUB_ENV"

      - name: Skip conflicted PRs
        if: env.PR_NUMBER != '' && env.MERGE_STATE == 'DIRTY'
        run: echo "Dependabot PR has merge conflicts. Auto-merge stays disabled."

      - name: Allow only patch and minor updates
        if: env.PR_NUMBER != '' && env.MERGE_STATE != 'DIRTY'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ env.PR_URL }}
        run: |
          text="$(gh pr view "$PR_URL" --json title,body --jq '.title + " " + .body')"
          pairs="$(printf '%s' "$text" | grep -oE 'from [0-9]+(\.[0-9]+)* to [0-9]+(\.[0-9]+)*' || true)"

          if [ -z "$pairs" ]; then
            echo "Could not determine version changes. Leaving PR for manual review."
            exit 0
          fi

          allow=true
          while IFS= read -r pair; do
            from_version="$(printf '%s' "$pair" | awk '{print $2}')"
            to_version="$(printf '%s' "$pair" | awk '{print $4}')"
            if [ "${from_version%%.*}" != "${to_version%%.*}" ]; then
              echo "Major bump detected ($from_version -> $to_version). Leaving PR for manual review."
              allow=false
            fi
          done <<EOF
          $pairs
          EOF

          if [ "$allow" = "true" ]; then
            echo "ALLOW_MERGE=true" >> "$GITHUB_ENV"
          fi

      - name: Merge Dependabot PR
        if: env.PR_NUMBER != '' && env.MERGE_STATE != 'DIRTY' && env.ALLOW_MERGE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ env.PR_URL }}
        run: gh pr merge --squash "$PR_URL"
