version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  # GitHub uses the npm ecosystem for pnpm manifests and lockfiles.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    # Preserve baseline runtime lines, including Docker Hub name normalization.
    ignore:
      - dependency-name: "*python"
        versions: [">=3.13"]
      - dependency-name: "*node"
        versions: [">=23"]
      - dependency-name: "*nginx"
        versions: [">=1.29"]
