# Access links carry secrets in query strings. Never log queries or referrers.
log_format token_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent "$http_user_agent"';
server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log token_safe;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Proxy API and health requests to the backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
    }

    # SPA fallback: serve index.html for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
